services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: nexora-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python apps/api/db/demo_reset.py
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./nexora.db

  # 2. Frontend Service (Next.js)
  - type: web
    name: nexora-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://nexora-api-6j17.onrender.com/api
